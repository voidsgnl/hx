[project]
name = "hx"
version = "0.1.0"
description = "Execution-oracle XSS scanner with browser-based WAF pass"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "playwright==1.62.0",
    "curl_cffi==0.17.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "flask>=3.0"]

[project.scripts]
hx = "hx.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["hx*"]